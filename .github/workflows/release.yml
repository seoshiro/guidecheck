name: Verify and deploy GuideCheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guidecheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test
      - run: pnpm build && pnpm test:production
      - run: pnpm build:browser
        env:
          VITE_BASE_PATH: /guidecheck/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser && pnpm test:browser:public
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-browser
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy free static portfolio tool
        id: deployment
        uses: actions/deploy-pages@v4
